<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goods Receiving Lite - AM024</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-Qrcode CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-sm sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 p-1.5 rounded-lg font-bold text-sm">⚡ GR</div>
                <h1 class="text-sm font-semibold tracking-wide">Goods Receiving Lite (AM024)</h1>
            </div>
            <input type="text" id="operator-name" placeholder="Nama Staf..." class="px-2.5 py-1 text-xs bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none w-28 sm:w-36">
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-3 py-4 flex-grow w-full space-y-4">
        
        <!-- Panel Upload & Scanner Ringkas -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Upload Manifest -->
            <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200">
                <label class="block text-[11px] font-semibold text-slate-600 uppercase mb-1">📂 Upload Manifest Supplier (>6rb Data)</label>
                <input type="file" id="upload-manifest" accept=".csv, .xlsx, .xls" class="block w-full text-[11px] text-slate-500 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-emerald-50 file:text-emerald-700 cursor-pointer">
                <p id="manifest-status" class="text-[10px] text-slate-400 mt-1">Belum ada manifest dimuat.</p>
            </div>

            <!-- Kamera / Scanner -->
            <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[11px] font-semibold text-slate-600 uppercase">📷 Kamera Scanner</span>
                    <button id="toggle-camera" class="px-2.5 py-1 text-[11px] bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Buka Kamera</button>
                </div>
                <div id="reader-container" class="hidden relative rounded-lg overflow-hidden bg-slate-900 h-36 mb-2">
                    <div id="reader"></div>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="manual-barcode" placeholder="Scan/Ketik Barcode / PLU..." class="flex-grow px-2.5 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500">
                    <button id="btn-submit-barcode" class="bg-slate-900 text-white px-3 py-1.5 text-xs font-medium rounded-lg">Cari</button>
                </div>
            </div>
        </div>

        <!-- Tabel Hasil Transaksi -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
                <h2 class="text-xs font-semibold text-slate-900 uppercase tracking-wider">📋 Hasil Verifikasi Barang Masuk</h2>
                <div class="flex gap-1.5">
                    <button id="btn-export-excel" class="px-2.5 py-1 bg-emerald-600 text-white text-[11px] font-medium rounded-lg">Excel</button>
                    <button id="btn-export-pdf" class="px-2.5 py-1 bg-rose-600 text-white text-[11px] font-medium rounded-lg">PDF</button>
                    <button id="btn-reset" class="px-2.5 py-1 bg-slate-200 text-slate-700 text-[11px] font-medium rounded-lg">Reset</button>
                </div>
            </div>

            <div class="overflow-x-auto border border-slate-100 rounded-lg max-h-96">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] sticky top-0">
                        <tr>
                            <th class="p-2.5">PLU / Barcode</th>
                            <th class="p-2.5">Deskripsi Produk</th>
                            <th class="p-2.5 text-center">Manifest</th>
                            <th class="p-2.5 text-center">Datang</th>
                            <th class="p-2.5 text-center">Selisih</th>
                            <th class="p-2.5">Status</th>
                            <th class="p-2.5 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body" class="divide-y divide-slate-100 text-xs">
                        <tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada barang discan.</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-500">
                <div>Total Tercatat: <span id="total-items" class="font-bold text-slate-800">0</span> Item</div>
            </div>
        </div>

    </main>

    <!-- Modal Input Qty -->
    <div id="item-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-3">
            <h3 class="text-sm font-bold text-slate-900">Konfirmasi Qty & Kondisi</h3>
            <div id="modal-product-info" class="bg-slate-50 p-2.5 rounded-xl text-[11px] space-y-1 text-slate-600 border border-slate-100"></div>
            <div class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-medium text-slate-600 mb-1">Jumlah Datang (Qty):</label>
                    <input type="number" id="modal-qty-input" class="w-full px-3 py-1.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500" min="1" value="1">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-slate-600 mb-1">Kondisi / Status:</label>
                    <select id="modal-condition-select" class="w-full px-3 py-1.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 bg-white">
                        <option value="NORMAL">Normal / Sesuai</option>
                        <option value="KURANG">Barang Kurang</option>
                        <option value="LEBIH">Barang Lebih (Tidak ada di Manifest)</option>
                        <option value="RETUR_EXPIRED">Retur Expired</option>
                        <option value="RETUR_RUSAK">Retur Kemasan Rusak</option>
                        <option value="BARU">Alokasi Produk Baru</option>
                    </select>
                </div>
                <div id="new-product-fields" class="hidden space-y-2 pt-1">
                    <input type="text" id="new-plu-input" placeholder="PLU Produk Baru..." class="w-full px-3 py-1.5 text-xs border border-slate-200 rounded-xl">
                    <input type="text" id="new-desc-input" placeholder="Deskripsi Produk Baru..." class="w-full px-3 py-1.5 text-xs border border-slate-200 rounded-xl">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="modal-cancel" class="px-3 py-1.5 text-[11px] font-medium text-slate-600 bg-slate-100 rounded-xl">Batal</button>
                <button id="modal-save" class="px-3 py-1.5 text-[11px] font-medium text-white bg-blue-600 rounded-xl">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Script Optimalisasi Performa HP -->
    <script>
        // Menggunakan Index Map Object untuk Pencarian Instan O(1) tanpa Lag
        let manifestMap = new Map();
        let transactions = JSON.parse(localStorage.getItem('am024_lite_tx')) || [];
        let html5QrCode = null;
        let cameraActive = false;
        let activeScannedItem = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderTable();

            document.getElementById('toggle-camera').addEventListener('click', toggleCamera);
            document.getElementById('btn-submit-barcode').addEventListener('click', () => {
                let code = document.getElementById('manual-barcode').value.trim();
                if(code) { processScannedCode(code); document.getElementById('manual-barcode').value = ''; }
            });
            document.getElementById('btn-reset').addEventListener('click', resetSession);
            document.getElementById('modal-cancel').addEventListener('click', closeModal);
            document.getElementById('modal-save').addEventListener('click', saveModalTransaction);
            document.getElementById('modal-condition-select').addEventListener('change', (e) => {
                let newFields = document.getElementById('new-product-fields');
                if(e.target.value === 'BARU') newFields.classList.remove('hidden');
                else newFields.classList.add('hidden');
            });

            document.getElementById('upload-manifest').addEventListener('change', handleManifestUpload);
        });

        // Handler Upload Manifest Super Cepat (Streaming / Parsing Ringan)
        function handleManifestUpload(e) {
            let file = e.target.files[0];
            if(!file) return;
            
            let reader = new FileReader();
            reader.onload = function(evt) {
                let data = new Uint8Array(evt.target.result);
                // Menggunakan read as array buffer dengan opsi minimal
                let workbook = XLSX.read(data, {type: 'array', cellDates: true, cellStyles: false});
                let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                let rows = XLSX.utils.sheet_to_json(firstSheet, {raw: true});
                
                manifestMap.clear();
                rows.forEach(r => {
                    let plu = String(r.plu || r.PLU || '').trim();
                    let barcode = String(r.barcode || r.Barcode || '').trim();
                    let descp = String(r.descp || r.DESCP || 'Tanpa Nama');
                    let qty = parseFloat(r.qty_rec || r.QTY_REC || r.qty || r.QTY || 0);

                    let itemObj = { descp, qty_rec: qty, plu, barcode };
                    if(plu) manifestMap.set(plu, itemObj);
                    if(barcode) manifestMap.set(barcode, itemObj);
                });

                document.getElementById('manifest-status.innerText` = '';
                document.getElementById('manifest-status').innerHTML = `✅ Manifest Aktif: <span class="font-bold text-emerald-600">${manifestMap.size} indeks data</span> siap scan!`;
            };
            reader.readAsArrayBuffer(file);
        }

        // Toggle Kamera dengan Resolusi Dioptimalkan agar HP Tidak Berat
        function toggleCamera() {
            let container = document.getElementById('reader-container');
            let btn = document.getElementById('toggle-camera');
            if(!cameraActive) {
                container.classList.remove('hidden');
                btn.innerText = 'Tutup';
                btn.classList.replace('bg-blue-600', 'bg-rose-600');
                
                html5QrCode = new Html5Qrcode("reader");
                // Konfigurasi QR Box kecil & FPS rendah agar CPU HP tidak overheat
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 5, qrbox: { width: 200, height: 100 } },
                    (decodedText) => {
                        processScannedCode(decodedText);
                        // Jeda sejenak atau matikan kamera otomatis setelah scan jika diinginkan
                    },
                    (errMsg) => {}
                ).catch(err => { alert("Kamera gagal diakses."); });
                cameraActive = true;
            } else {
                if(html5QrCode) {
                    html5QrCode.stop().then(() => {
                        container.classList.add('hidden');
                        btn.innerText = 'Buka Kamera';
                        btn.classList.replace('bg-rose-600', 'bg-blue-600');
                        cameraActive = false;
                    });
                }
            }
        }

        // Proses Lookup Instan menggunakan Map O(1)
        function processScannedCode(code) {
            let item = manifestMap.get(code);

            activeScannedItem = {
                code: code,
                plu: item ? item.plu : code,
                descp: item ? item.descp : '',
                manifestQty: item ? item.qty_rec : 0,
                isNew: !item
            };

            let infoHtml = `
                <div><b>Kode:</b> ${code}</div>
                <div><b>PLU:</b> ${activeScannedItem.plu}</div>
                <div><b>Deskripsi:</b> ${activeScannedItem.descp || 'Produk Baru / Tidak ada di Manifest'}</div>
                <div><b>Manifest Qty:</b> ${activeScannedItem.manifestQty}</div>
            `;
            document.getElementById('modal-product-info').innerHTML = infoHtml;
            document.getElementById('modal-qty-input').value = 1;
            
            let conditionSelect = document.getElementById('modal-condition-select');
            if(!item) {
                conditionSelect.value = 'BARU';
                document.getElementById('new-product-fields').classList.remove('hidden');
                document.getElementById('new-plu-input').value = code;
                document.getElementById('new-desc-input').value = '';
            } else {
                conditionSelect.value = 'NORMAL';
                document.getElementById('new-product-fields').classList.add('hidden');
            }

            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('item-modal').classList.add('hidden');
            activeScannedItem = null;
        }

        function saveModalTransaction() {
            if(!activeScannedItem) return;
            let qtyDatang = parseInt(document.getElementById('modal-qty-input').value) || 0;
            let condition = document.getElementById('modal-condition-select').value;
            
            if(condition === 'BARU') {
                activeScannedItem.plu = document.getElementById('new-plu-input').value || activeScannedItem.code;
                activeScannedItem.descp = document.getElementById('new-desc-input').value || 'Produk Baru Alokasi';
            }

            let manifestQty = activeScannedItem.manifestQty;
            let selisih = qtyDatang - manifestQty;
            let keterangan = condition;

            if(condition === 'BARU') keterangan = "Alokasi Produk Baru";
            else if(condition === 'RETUR_EXPIRED') keterangan = "Retur Expired";
            else if(condition === 'RETUR_RUSAK') keterangan = "Retur Rusak Pengiriman";
            else if(manifestQty === 0 && !activeScannedItem.isNew) keterangan = "Barang Lebih";
            else if(selisih < 0) keterangan = `Barang Kurang (${Math.abs(selisih)})`;
            else if(selisih > 0) keterangan = "Barang Lebih";
            else keterangan = "Normal / Sesuai";

            let transactionItem = {
                id: Date.now(),
                tanggal: new Date().toLocaleDateString('id-ID'),
                user: document.getElementById('operator-name').value || 'Staf',
                plu: activeScannedItem.plu,
                barcode: activeScannedItem.code,
                descp: activeScannedItem.descp,
                manifestQty: manifestQty,
                qtyDatang: qtyDatang,
                selisih: selisih,
                keterangan: keterangan
            };

            transactions.push(transactionItem);
            localStorage.setItem('am024_lite_tx', JSON.stringify(transactions));
            renderTable();
            closeModal();
        }

        function renderTable() {
            let tbody = document.getElementById('transaction-table-body');
            document.getElementById('total-items').innerText = transactions.length;

            if(transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada barang discan.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            // Render dari item terbaru ke terlama
            [...transactions].reverse().forEach((tx) => {
                let badgeColor = "bg-emerald-100 text-emerald-800";
                if(tx.keterangan.includes("Kurang") || tx.keterangan.includes("Retur")) badgeColor = "bg-rose-100 text-rose-800";
                else if(tx.keterangan.includes("Lebih") || tx.keterangan.includes("Baru")) badgeColor = "bg-amber-100 text-amber-800";

                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-2.5 font-mono text-slate-600">${tx.plu}<br><span class="text-[9px] text-slate-400">${tx.barcode}</span></td>
                    <td class="p-2.5 font-medium text-slate-900">${tx.descp}</td>
                    <td class="p-2.5 text-center">${tx.manifestQty}</td>
                    <td class="p-2.5 text-center font-bold">${tx.qtyDatang}</td>
                    <td class="p-2.5 text-center font-semibold ${tx.selisih < 0 ? 'text-rose-600' : tx.selisih > 0 ? 'text-amber-600' : 'text-slate-600'}">${tx.selisih > 0 ? '+' + tx.selisih : tx.selisih}</td>
                    <td class="p-2.5"><span class="px-2 py-0.5 rounded-full text-[9px] font-semibold ${badgeColor}">${tx.keterangan}</span></td>
                    <td class="p-2.5 text-center">
                        <button onclick="deleteTransaction(${tx.id})" class="text-rose-500 font-medium text-[11px]">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('am024_lite_tx', JSON.stringify(transactions));
            renderTable();
        }

        function resetSession() {
            if(confirm("Reset seluruh data entry sesi ini?")) {
                transactions = [];
                localStorage.removeItem('am024_lite_tx');
                renderTable();
            }
        }

        // Export Excel
        document.getElementById('btn-export-excel').addEventListener('click', () => {
            if(transactions.length === 0) { alert("Data kosong!"); return; }
            let worksheet = XLSX.utils.json_to_sheet(transactions);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Goods Receiving");
            XLSX.writeFile(workbook, `GR_AM024_${new Date().toISOString().slice(0,10)}.xlsx`);
        });

        // Export PDF
        document.getElementById('btn-export-pdf').addEventListener('click', () => {
            if(transactions.length === 0) { alert("Data kosong!"); return; }
            const { jsPDF } = window.jspdf;
            let doc = new jsPDF('landscape');
            doc.text("Laporan Goods Receiving AM024", 14, 15);
            let rows = transactions.map(t => [t.tanggal, t.plu, t.descp, t.manifestQty, t.qtyDatang, t.selisih, t.keterangan, t.user]);
            doc.autoTable({ head: [['Tanggal', 'PLU', 'Deskripsi', 'Manifest', 'Datang', 'Selisih', 'Keterangan', 'User']], body: rows, startY: 20, styles: { fontSize: 8 } });
            doc.save(`GR_AM024_${new Date().toISOString().slice(0,10)}.pdf`);
        });
    </script>
</body>
</html>
